<!DOCTYPE html> <!-- Declara el tipo de documento como HTML5 para que el navegador lo interprete correctamente -->

        body { background-color: #c8d5c3; font-family: sans-serif; } /* Define el color de fondo gris verdoso y la fuente general de la página */

        .nav-link { font-weight: 600; color: #2b2b2b; } /* Define el grosor de texto y color gris oscuro para los enlaces del menú */

    </style> 
</head> <!-- Fin de la cabecera -->

            </div>
            <nav class="flex space-x-6 text-lg"> <!-- Sección de navegación con espacio horizontal uniforme entre los enlaces -->

                <a href="historia.html" class="nav-link">Historia</a> <!-- Enlace a la página de Historia -->
                <a href="personajes.html" class="nav-link">Personajes</a> <!-- Enlace a la página de Personajes -->
                <a href="datos.html" class="nav-link">Datos Curiosos</a> <!-- Enlace a la página de Datos Curiosos -->

        </h1>

        <!-- Imagen debajo del título -->
        <div class="max-w-md w-full px-4"> <!-- Contenedor para limitar el ancho máximo de la imagen de la bandera -->

        </div>
    </main>

    <!-- Pie de página con datos personales -->
    <footer class="bg-[#173224] text-white py-4 text-center text-sm font-semibold"> <!-- Pie de página con fondo verde patrio oscuro, texto blanco y centrado -->
