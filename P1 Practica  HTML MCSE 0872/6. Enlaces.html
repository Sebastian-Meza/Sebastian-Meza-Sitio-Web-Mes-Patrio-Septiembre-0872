<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces en HTML</title>
</head>
<body>
    <h2>Tipos de enlaces en HTML</h2>
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>
    
    <!-- Enlace normal que abre el archivo en la misma pestaña -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    
    <!-- target="_self" es la opción por defecto: abre el enlace en la pestaña actual -->
    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>
        
    <!-- target="_blank" abre el enlace en una nueva pestaña -->
    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>
        
    <!-- target="_parent" abre el enlace en el marco padre (útil si usas frames/iframes) -->
    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>
        
    <!-- target="_top" rompe con todos los marcos y abre la página en la ventana completa -->
    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>
        
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    
    <!-- Enlaces hacia sitios web externos mediante sus URLs completas -->
    <a href="https://www.google.com/">Google</a><br>
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
</body>
</html>
