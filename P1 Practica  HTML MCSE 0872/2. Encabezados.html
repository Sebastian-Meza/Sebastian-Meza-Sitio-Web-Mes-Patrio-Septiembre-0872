<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezados HTML</title>
</head>

<body>
    <!-- <h1> es el título principal y más grande de la página (solo se recomienda uno por página) -->
    <h1>Titulo 1</h1>
    
    <!-- <h2> a <h6> representan subtítulos de menor jerarquía y tamaño gradualmente -->
    <h2>Titulo 2</h2>
    <h3>Titulo 3</h3>
    <h4>Titulo 4</h4>
    <h5>Titulo 5</h5>
    
    <!-- <h6> es el nivel de encabezado más pequeño -->
    <h6>Titulo 6</h6>
</body>

</html>
